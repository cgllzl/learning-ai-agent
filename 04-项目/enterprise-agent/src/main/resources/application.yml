server:
  port: 8080

spring:
  application:
    name: enterprise-agent

management:
  endpoints:
    web:
      exposure:
        include: health,info

# DeepSeek LLM 配置（OpenAI 兼容接口，Day 2 的 /chat 使用）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  timeout: 30s
  max-retries: 2
  fallback-model: deepseek-chat

# Agent 配置（Week 2 Day 6：防死循环）
agent:
  max-sequential-tools-invocations: 3
