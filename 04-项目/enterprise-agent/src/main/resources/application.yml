server:
  port: 8080

spring:
  application:
    name: enterprise-agent

  # 文件上传大小限制（RAG 文档入库）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  # Day 2 本地前端来源；部署环境用逗号分隔的 FRONTEND_ORIGINS 覆盖。
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

demo:
  auth:
    # 演示会话只存在后端内存中，重启即失效；Priority 2 再持久化正式身份数据。
    session-ttl: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info

# DeepSeek LLM 配置（OpenAI 兼容接口，Day 2 的 /chat 使用）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  timeout: 30s
  max-retries: 2
  fallback-model: deepseek-chat

# Agent 配置（Week 2 Day 6：防死循环）
agent:
  max-sequential-tools-invocations: 3
  workflow:
    # Week 6.5 Day 1：有限质量复核循环，达到上限后必须转人工
    max-review-iterations: 3
