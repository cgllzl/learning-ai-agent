name: Agent Eval CI

on:
  push:
  pull_request:

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-项目/enterprise-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run offline evaluation and governance gate
        run: mvn -B test -Dtest=AgentEvalCaseCatalogTest,AgentEvaluationServiceTest,CiEvaluationGateTest,TrajectoryEvaluatorTest,AgentComparisonReportTest,TrajectoryRecorderTest,McpCompatibilityTest,McpToolTrustPolicyTest,McpRemoteCredentialTest,SecureMcpToolProviderTest,EnterpriseOrderAfterSalesSkillTest,WorkbenchRoutingServiceTest,WorkbenchRouteControllerTest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check deterministic Skill script
        run: python -m unittest discover -v -s ../skills/enterprise-order-after-sales/scripts -p test_validate_after_sales_request.py
